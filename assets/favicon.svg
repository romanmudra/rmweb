<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Roman Mudra">
  <title>Roman Mudra</title>

  <!-- Ikona nemá vlastní podklad — prosvítá pod ní lišta prohlížeče
       a logo se jí přizpůsobuje:

       světlý motiv : "R" černé jako v logu, "M" v tmavších odstínech
                      z palety webu, aby na bílé nezmizelo
       tmavý motiv  : "R" bílé, "M" v původním neonovém gradientu z loga

       Důvod pro dvě verze "M": původní gradient končí na #00f2fe,
       což má na neaktivní šedé záložce kontrast 1,06 — prakticky
       neviditelné. Zbylo by tam samotné "R". -->
  <style>
    .rm-r      { fill: #111111; }
    .rm-grad-a { stop-color: #0D6E9E; }
    .rm-grad-b { stop-color: #028FA3; }
    @media (prefers-color-scheme: dark) {
      .rm-r      { fill: #FFFFFF; }
      .rm-grad-a { stop-color: #4facfe; }
      .rm-grad-b { stop-color: #00f2fe; }
    }
  </style>

  <defs>
    <linearGradient id="rm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop class="rm-grad-a" offset="0%"/>
      <stop class="rm-grad-b" offset="100%"/>
    </linearGradient>
  </defs>

  <!-- Písmena v původních souřadnicích loga, zvětšená a vystředěná do čtverce.
       Stín z velkého loga tu chybí záměrně — v 16 px se slije do šmouhy. -->
  <g transform="translate(-15.69 -0.46) scale(1.023)">
    <text class="rm-r" x="15" y="45" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="200" font-size="48">R</text>
    <text x="38" y="52" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="300" font-size="48" fill="url(#rm-grad)">M</text>
  </g>
</svg>
