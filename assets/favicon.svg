<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Roman Mudra">
  <title>Roman Mudra</title>
  <defs>
    <linearGradient id="rm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <!-- Tmavý podklad: logo má bílé "R", takže na světlé liště prohlížeče
       by se ztratilo. Na tmavém čtverci drží čitelnost bílé R i azurové M
       ve světlém i tmavém režimu, takže není potřeba řešit dvě varianty. -->
  <rect width="64" height="64" rx="13" fill="#17181A"/>

  <!-- Písmena v původních souřadnicích loga, jen zmenšená a vystředěná.
       Stín z velkého loga tu záměrně chybí — v 16 px by se slil do šmouhy. -->
  <g transform="translate(-6.98 5.42) scale(0.836)">
    <text x="15" y="45" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="200" font-size="48" fill="#ffffff">R</text>
    <text x="38" y="52" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="300" font-size="48" fill="url(#rm-grad)">M</text>
  </g>
</svg>
