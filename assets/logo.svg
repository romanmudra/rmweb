<svg width="75" height="60" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Definice neonového přechodu pro písmeno M -->
        <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4facfe" />
            <stop offset="100%" stop-color="#00f2fe" />
        </linearGradient>
        
        <!-- Definice 3D stínu pro písmeno M -->
        <filter id="shadow-3d" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
        </filter>
    </defs>

    <!-- Písmeno R -->
    <!-- Atribut fill="#ffffff" znamená bílou barvu. Pro světlé pozadí změň na #111111 -->
    <text x="15" y="45" font-family="'Montserrat', sans-serif" font-weight="200" font-size="48" fill="#ffffff">R</text>
    
    <!-- Písmeno M -->
    <text x="38" y="52" font-family="'Montserrat', sans-serif" font-weight="300" font-size="48" fill="url(#neon-grad)" filter="url(#shadow-3d)">M</text>
</svg>
